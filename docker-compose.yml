services:
  drycalc:
    build: .
    container_name: ${DRYWATCH_CONTAINER_NAME:-agff-drycalc}
    restart: unless-stopped
    networks:
      - web-netzwerk
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${DRYWATCH_STACK:-drywatch}.rule=Host(`${DRYWATCH_HOST:-apps.graswachstum.ch}`) && (Path(`${DRYWATCH_BASE_PATH:-/drywatch}`) || PathPrefix(`${DRYWATCH_BASE_PATH:-/drywatch}/`))"
      - "traefik.http.routers.${DRYWATCH_STACK:-drywatch}.entrypoints=web"
      - "traefik.http.middlewares.${DRYWATCH_STACK:-drywatch}-strip.stripprefix.prefixes=${DRYWATCH_BASE_PATH:-/drywatch}"
      - "traefik.http.routers.${DRYWATCH_STACK:-drywatch}.middlewares=${DRYWATCH_STACK:-drywatch}-strip"
      - "traefik.http.services.drycalc.loadbalancer.server.port=80"

networks:
  web-netzwerk:
    external: true
